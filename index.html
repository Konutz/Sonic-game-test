<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Sonic Platform Runner</title>
  <style>
    * { 
      box-sizing: border-box; 
      touch-action: none; 
      -webkit-user-select: none; 
      user-select: none; 
      -webkit-touch-callout: none;
    }
    body { 
      background: #0f1423; 
      color: white; 
      font-family: sans-serif; 
      display: flex; 
      flex-direction: column; 
      align-items: center; 
      justify-content: flex-start; 
      min-height: 100vh; 
      margin: 0; 
      padding: 0; 
      overflow: hidden; 
      position: relative; 
    }

    #gameContainer {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      width: 100%;
      height: 100%; 
      max-height: 100vh;
    }

    canvas { 
      border: 3px solid #2c3e50; 
      border-radius: 8px; 
      background: #1a1a2e; 
      box-shadow: 0 10px 25px rgba(0,0,0,0.5); 
      max-width: 98%; 
      height: auto;
      object-fit: contain;
      margin-top: 60px;
    }

    #scoreBoard { 
      position: fixed;
      top: 10px;
      font-size: 16px; 
      font-weight: bold; 
      display: flex; 
      gap: 20px; 
      background: rgba(0,0,0,0.7); 
      padding: 8px 15px; 
      border-radius: 20px; 
      z-index: 100;
      backdrop-filter: blur(4px);
    }
    .ring-count { color: #f1c40f; }

    .controls { 
      display: flex; 
      justify-content: space-between; 
      align-items: center;
      width: 100%;
      padding: 20px;
      z-index: 20;
      pointer-events: none;
    }
    .controls .btn { pointer-events: auto; }

    .btn { 
      width: 90px; 
      height: 90px; 
      background: rgba(255, 255, 255, 0.2); 
      border: 3px solid rgba(255, 255, 255, 0.7); 
      border-radius: 18px; 
      color: white; 
      font-size: 36px; 
      font-weight: bold; 
      display: flex; 
      align-items: center; 
      justify-content: center; 
      cursor: pointer; 
      backdrop-filter: blur(4px);
      transition: transform 0.05s, background 0.1s;
    }
    .btn:active { 
      background: rgba(255, 255, 255, 0.4); 
      transform: scale(0.95);
    }

    .btn-jump { 
      width: 125px; 
      height: 125px; 
      background: rgba(231, 76, 60, 0.7); 
      border-color: rgba(231, 76, 60, 0.9); 
      font-size: 44px;
      border-radius: 24px;
    }

    @media (orientation: portrait) {
      body, #gameContainer { justify-content: flex-start; }
      canvas { margin-top: 65px; max-width: 100%; border-radius: 0; border-left: none; border-right: none; }
      .controls { position: relative; margin-top: auto; margin-bottom: 25px; padding: 10px 20px; }
    }

    @media (orientation: landscape) and (max-height: 500px) {
      body, #gameContainer { justify-content: center; height: 100vh; }
      canvas { margin-top: 0; border: none; border-radius: 0; width: 100vw; height: 100vh; object-fit: cover; }
      #scoreBoard { top: 5px; font-size: 14px; padding: 4px 12px; }
      .controls { position: absolute; bottom: 10px; left: 0; padding: 0 20px; }
      .btn { width: 75px; height: 75px; font-size: 28px; background: rgba(255, 255, 255, 0.15); }
      .btn-jump { width: 105px; height: 105px; }
    }

    #startOverlay {
      position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
      background: rgba(15, 20, 35, 0.95);
      display: flex; flex-direction: column; justify-content: center; align-items: center;
      z-index: 999; gap: 12px; padding: 20px;
    }
    .main-title { margin: 0; color: #f1c40f; font-size: 30px; text-transform: uppercase; text-align: center; }
    .game-over-text { color: #e74c3c; font-size: 18px; margin: -5px 0 5px 0; font-weight: bold; }
    .last-score-badge { background: rgba(255, 255, 255, 0.15); padding: 6px 16px; border-radius: 15px; font-size: 15px; }

    #startButton {
      padding: 12px 35px; font-size: 18px; font-weight: bold; color: white;
      background: #e74c3c; border: none; border-radius: 30px; cursor: pointer;
      box-shadow: 0 4px 15px rgba(231, 76, 60, 0.5);
    }

    .leaderboard-box {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 12px;
      padding: 10px 15px;
      width: 100%; max-width: 300px; max-height: 150px;
      overflow-y: auto; text-align: center;
    }
    .leaderboard-box h3 { margin: 0 0 8px 0; color: #f1c40f; font-size: 15px; }
    .leaderboard-list { list-style: none; padding: 0; margin: 0; font-size: 13px; text-align: left; }
    .leaderboard-list li { display: flex; justify-content: space-between; padding: 3px 0; border-bottom: 1px solid rgba(255,255,255,0.08); }
    .leaderboard-list li span.rank { color: #e74c3c; font-weight: bold; width: 22px; }
  </style>

  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
</head>
<body>

  <div id="startOverlay">
    <h1 class="main-title" id="menuTitle">Sonic Runner</h1>
    <div id="gameOverMsg" class="game-over-text" style="display: none;">GAME OVER</div>
    <div id="lastScoreBox" class="last-score-badge" style="display: none;">Score : <span id="finalScoreVal">0</span>m</div>

    <div class="leaderboard-box">
      <h3>🏆 TOP 10 MONDIAL</h3>
      <ol class="leaderboard-list" id="leaderboardList">
        <li>Connexion aux scores...</li>
      </ol>
    </div>

    <button id="startButton">JOUER 🔊</button>
  </div>

  <div id="gameContainer">
    <div id="scoreBoard">
      <div>Distance : <span id="dist">0</span>m</div>
      <div class="ring-count">Rings : <span id="ringDist">0</span></div>
    </div>
    
    <canvas id="gameCanvas" width="800" height="400"></canvas>

    <div class="controls">
      <div class="d-pad" style="display:flex; gap:12px;">
        <div class="btn" id="btnLeft">◄</div>
        <div class="btn" id="btnRight">►</div>
      </div>
      <div class="action-pad">
        <div class="btn btn-jump" id="btnJump">▲</div>
      </div>
    </div>
  </div>

<script>
// --- CONFIGURATION FIREBASE ---
const firebaseConfig = {
  apiKey: "AIzaSyAc_ayd7Ij-ED_nCORcicOZvCMg_TzAMPs",
  authDomain: "sonic-runner-bc2f2.firebaseapp.com",
  projectId: "sonic-runner-bc2f2",
  storageBucket: "sonic-runner-bc2f2.firebasestorage.app",
  messagingSenderId: "311207510980",
  appId: "1:311207510980:web:9a01cdf8ded32c87efda91",
  databaseURL: "https://sonic-runner-bc2f2-default-rtdb.europe-west1.firebasedatabase.app/"
};

let db = null;
try {
  if (typeof firebase !== 'undefined') {
    firebase.initializeApp(firebaseConfig);
    db = firebase.database();
  }
} catch (e) {
  console.warn("Firebase non initialisé:", e);
}

const leaderboardList = document.getElementById('leaderboardList');
let playerName = localStorage.getItem('sonic_player_name') || '';

function listenToHighScores() {
  if (!db) {
    leaderboardList.innerHTML = "<li>Mode hors-ligne</li>";
    return;
  }
  db.ref('scores').orderByChild('score').limitToLast(10).on('value', (snapshot) => {
    const scores = [];
    snapshot.forEach((childSnapshot) => { scores.push(childSnapshot.val()); });
    scores.reverse();

    if (scores.length === 0) {
      leaderboardList.innerHTML = "<li>Aucun score enregistré.</li>";
      return;
    }

    leaderboardList.innerHTML = scores.map((entry, index) => `
      <li>
        <span class="rank">#${index + 1}</span>
        <span>${entry.name}</span>
        <strong>${entry.score}m</strong>
      </li>
    `).join('');
  }, () => {
    leaderboardList.innerHTML = "<li>Erreur de connexion</li>";
  });
}

function submitScore(score) {
  if (!db || score < 10) return;
  if (!playerName) {
    playerName = prompt("Nouveau record ! Entre ton pseudo :", "SonicPlayer");
    if (playerName) {
      playerName = playerName.replace(/[^a-zA-Z0-9]/g, "").substring(0, 12);
      localStorage.setItem('sonic_player_name', playerName);
    } else {
      playerName = "Anonyme";
    }
  }
  db.ref('scores').push({ name: playerName, score: score, timestamp: Date.now() });
}

listenToHighScores();

// --- LOGIQUE DU JEU & SPRITES ---
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
const distElement = document.getElementById('dist');
const ringDistElement = document.getElementById('ringDist');

const startOverlay = document.getElementById('startOverlay');
const startButton = document.getElementById('startButton');
const menuTitle = document.getElementById('menuTitle');
const gameOverMsg = document.getElementById('gameOverMsg');
const lastScoreBox = document.getElementById('lastScoreBox');
const finalScoreVal = document.getElementById('finalScoreVal');

// Chargement des Sprites
const sonicIdle = new Image(); sonicIdle.src = 'Sonic.png';
const sonicRunFrames = [new Image(), new Image(), new Image(), new Image()];
sonicRunFrames[0].src = 'Sonic1.png';
sonicRunFrames[1].src = 'Sonic2.png';
sonicRunFrames[2].src = 'Sonic3.png';
sonicRunFrames[3].src = 'Sonic4.png';
const sonicJump = new Image(); sonicJump.src = 'sonic-jump.png';
const superSonicImg = new Image(); superSonicImg.src = 'supersonic.png';
const sonicGetHitImg = new Image(); sonicGetHitImg.src = 'sonicgethit.png';
const sonicDeadImg = new Image(); sonicDeadImg.src = 'sonicdead.png';

const ringSprite = new Image(); ringSprite.src = 'ring.gif';
const foeSprite = new Image(); foeSprite.src = 'Foe.png';
const foeFlySprite = new Image(); foeFlySprite.src = 'Foefly.png';

const greenhillImg = new Image(); greenhillImg.src = 'greenhill.png';
const skyImg = new Image(); skyImg.src = 'sky.png';
const bgImg = new Image(); bgImg.src = 'background.png';
const seaImg = new Image(); seaImg.src = 'sea.png';

let greenhillPattern = null;
greenhillImg.onload = () => { greenhillPattern = ctx.createPattern(greenhillImg, 'repeat'); };

let audioCtx = null;
let gameStarted = false;
let superMusicTimerId = null;
let normalMusicTimerId = null;

function initAudio() {
  try {
    if (!audioCtx) {
      const AudioContextClass = window.AudioContext || window.webkitAudioContext;
      if (AudioContextClass) audioCtx = new AudioContextClass();
    }
    if (audioCtx && audioCtx.state === 'suspended') {
      audioCtx.resume();
    }
  } catch (e) {
    console.warn("Audio non supporté:", e);
  }
}

function playSound(type) {
  if (!audioCtx) return;
  try {
    const now = audioCtx.currentTime;
    if (type === 'ring') {
      const osc1 = audioCtx.createOscillator(), osc2 = audioCtx.createOscillator(), gain = audioCtx.createGain();
      osc1.type = 'sine'; osc2.type = 'sine';
      osc1.frequency.setValueAtTime(987.77, now);
      osc2.frequency.setValueAtTime(1318.51, now + 0.08);
      gain.gain.setValueAtTime(0.15, now);
      gain.gain.exponentialRampToValueAtTime(0.01, now + 0.25);
      osc1.connect(gain); osc2.connect(gain); gain.connect(audioCtx.destination);
      osc1.start(now); osc1.stop(now + 0.08); osc2.start(now + 0.08); osc2.stop(now + 0.25);
    } else if (type === 'boost') {
      const osc = audioCtx.createOscillator(), gain = audioCtx.createGain();
      osc.type = 'sine'; osc.frequency.setValueAtTime(400, now);
      osc.frequency.exponentialRampToValueAtTime(1200, now + 0.3);
      gain.gain.setValueAtTime(0.2, now); gain.gain.exponentialRampToValueAtTime(0.01, now + 0.3);
      osc.connect(gain); gain.connect(audioCtx.destination);
      osc.start(now); osc.stop(now + 0.3);
    } else if (type === 'super') {
      const osc = audioCtx.createOscillator(), gain = audioCtx.createGain();
      osc.type = 'triangle'; osc.frequency.setValueAtTime(300, now);
      osc.frequency.exponentialRampToValueAtTime(1800, now + 0.8);
      gain.gain.setValueAtTime(0.3, now); gain.gain.exponentialRampToValueAtTime(0.01, now + 0.8);
      osc.connect(gain); gain.connect(audioCtx.destination);
      osc.start(now); osc.stop(now + 0.8);
    } else if (type === 'jump') {
      const osc = audioCtx.createOscillator(), gain = audioCtx.createGain();
      osc.type = 'square'; osc.frequency.setValueAtTime(150, now);
      osc.frequency.exponentialRampToValueAtTime(600, now + 0.15);
      gain.gain.setValueAtTime(0.1, now); gain.gain.exponentialRampToValueAtTime(0.01, now + 0.15);
      osc.connect(gain); gain.connect(audioCtx.destination);
      osc.start(now); osc.stop(now + 0.15);
    } else if (type === 'hit') {
      const osc = audioCtx.createOscillator(), gain = audioCtx.createGain();
      osc.type = 'triangle'; osc.frequency.setValueAtTime(300, now);
      osc.frequency.exponentialRampToValueAtTime(800, now + 0.12);
      gain.gain.setValueAtTime(0.2, now); gain.gain.exponentialRampToValueAtTime(0.01, now + 0.12);
      osc.connect(gain); gain.connect(audioCtx.destination);
      osc.start(now); osc.stop(now + 0.12);
    } else if (type === 'hurt_dead') {
      const osc = audioCtx.createOscillator(), gain = audioCtx.createGain();
      osc.type = 'triangle';
      osc.frequency.setValueAtTime(150, now);
      osc.frequency.linearRampToValueAtTime(40, now + 0.35);
      gain.gain.setValueAtTime(0.3, now);
      gain.gain.linearRampToValueAtTime(0.01, now + 0.35);
      osc.connect(gain); gain.connect(audioCtx.destination);
      osc.start(now); osc.stop(now + 0.35);
    }
  } catch (e) {}
}

function startNormalMusic() {
  if (!audioCtx) return;
  stopNormalMusic(); stopSuperMusic();
  const notes = [261.63, 329.63, 392.00, 523.25, 349.23, 440.00, 523.25, 698.46, 392.00, 493.88, 587.33, 783.99, 349.23, 440.00, 523.25, 659.25];
  let noteIdx = 0;
  normalMusicTimerId = setInterval(() => {
    if (superSonicTimer > 0 || !gameStarted || isDead) { stopNormalMusic(); return; }
    try {
      const now = audioCtx.currentTime, osc = audioCtx.createOscillator(), gain = audioCtx.createGain();
      osc.type = 'sine'; osc.frequency.setValueAtTime(notes[noteIdx], now);
      gain.gain.setValueAtTime(0.035, now); gain.gain.exponentialRampToValueAtTime(0.001, now + 0.38);
      osc.connect(gain); gain.connect(audioCtx.destination);
      osc.start(now); osc.stop(now + 0.38);
      noteIdx = (noteIdx + 1) % notes.length;
    } catch (e) {}
  }, 400);
}

function stopNormalMusic() { if (normalMusicTimerId) { clearInterval(normalMusicTimerId); normalMusicTimerId = null; } }

function startSuperMusic() {
  if (!audioCtx) return;
  stopNormalMusic(); stopSuperMusic();
  const notes = [523.25, 659.25, 783.99, 1046.50, 880.00, 1046.50, 1174.66, 1318.51, 1046.50, 880.00, 783.99, 659.25, 587.33, 659.25, 698.46, 783.99];
  let noteIdx = 0;
  superMusicTimerId = setInterval(() => {
    if (superSonicTimer <= 0 || !gameStarted || isDead) { stopSuperMusic(); if (gameStarted && !isDead) startNormalMusic(); return; }
    try {
      const now = audioCtx.currentTime, osc = audioCtx.createOscillator(), gain = audioCtx.createGain();
      osc.type = 'sawtooth'; osc.frequency.setValueAtTime(notes[noteIdx], now);
      gain.gain.setValueAtTime(0.06, now); gain.gain.exponentialRampToValueAtTime(0.001, now + 0.11);
      osc.connect(gain); gain.connect(audioCtx.destination);
      osc.start(now); osc.stop(now + 0.11);
      noteIdx = (noteIdx + 1) % notes.length;
    } catch (e) {}
  }, 120);
}

function stopSuperMusic() { if (superMusicTimerId) { clearInterval(superMusicTimerId); superMusicTimerId = null; } }
function stopAllMusic() { stopNormalMusic(); stopSuperMusic(); }

const BASE_ACCEL = 1.2;
const BASE_TOP_SPEED = 9;
const FRICTION = 0.82;
const GRAVITY = 0.8;

const INITIAL_JUMP_FORCE = -8;
const JUMP_HOLD_ACCEL = -1.1;
const MAX_JUMP_HOLD_TIME = 10;
const CUTOFF_JUMP_VY = -4;

let player = { x: 100, y: 200, width: 38, height: 48, vx: 0, vy: 0, isGrounded: false, facingRight: true };
let isJumping = false;
let jumpTimer = 0;

let isHit = false;
let isDead = false;
let invincibilityTimer = 0;

let runAnimTimer = 0;
let jumpRotationAngle = 0;
let ringScore = 0;
let ringAnimAngle = 0;
let boostTimer = 0;
let superSonicTimer = 0; 
let lastSuperThreshold = 0; 
let rings = [];
let lostRings = []; // Anneaux expulsés lors d'un impact
let foes = [];
let platforms = [];
let currentLevelY = 320;
let nextPlatformX = 0;
let cameraX = 0;
let maxDistanceReached = 0;
let welcomeMsgTimer = 0;

const inputs = { left: false, right: false, up: false, down: false, jumpPressed: false };

function ejectRings() {
  const numRingsToScatter = Math.min(ringScore, 16); // Maximum 16 anneaux visibles expulsés
  const centerX = player.x + player.width / 2;
  const centerY = player.y + player.height / 2;

  for (let i = 0; i < numRingsToScatter; i++) {
    const angle = (Math.PI * 2 / numRingsToScatter) * i + (Math.random() * 0.2);
    const speed = 4 + Math.random() * 5;
    lostRings.push({
      x: centerX,
      y: centerY,
      vx: Math.cos(angle) * speed,
      vy: Math.sin(angle) * speed - 2,
      width: 18,
      height: 18,
      life: 120 // Durée de vie des anneaux éjectés
    });
  }
}

function resetGameData() {
  stopAllMusic();
  player = { x: 100, y: 200, width: 38, height: 48, vx: 0, vy: 0, isGrounded: false, facingRight: true };
  isJumping = false;
  isHit = false;
  isDead = false;
  invincibilityTimer = 0;
  jumpTimer = 0;
  runAnimTimer = 0;
  jumpRotationAngle = 0;
  ringScore = 0;
  boostTimer = 0;
  superSonicTimer = 0;
  lastSuperThreshold = 0;
  welcomeMsgTimer = 210;
  rings = [];
  lostRings = [];
  foes = [];
  platforms = [{ x: 0, y: 320, width: 700, height: 150 }];
  currentLevelY = 320;
  nextPlatformX = 700;
  cameraX = 0;
  maxDistanceReached = 0;
  
  distElement.textContent = "0";
  ringDistElement.textContent = "0";
}

function startGame() {
  initAudio();
  resetGameData();
  gameStarted = true;
  startOverlay.style.display = 'none';
  playSound('jump');
  startNormalMusic();
}

startButton.addEventListener('click', startGame);

function triggerGameOver() {
  stopAllMusic();
  gameStarted = false;
  submitScore(maxDistanceReached);
  
  menuTitle.textContent = "GAME OVER";
  gameOverMsg.style.display = 'block';
  finalScoreVal.textContent = maxDistanceReached;
  lastScoreBox.style.display = 'block';
  startButton.textContent = "REJOUER 🔄";
  startOverlay.style.display = 'flex';
}

function startJump() {
  if (!gameStarted || isHit || isDead) return;
  inputs.jumpPressed = true;

  if (superSonicTimer > 0) {
    inputs.up = true;
  } else if (player.isGrounded) { 
    player.vy = INITIAL_JUMP_FORCE; 
    player.isGrounded = false; 
    isJumping = true;
    jumpTimer = 0;
    playSound('jump'); 
  }
}

function endJump() {
  inputs.jumpPressed = false;
  inputs.up = false;

  if (isJumping) {
    isJumping = false;
    if (player.vy < CUTOFF_JUMP_VY) {
      player.vy = CUTOFF_JUMP_VY;
    }
  }
}

window.addEventListener('keydown', (e) => {
  if (!gameStarted || isDead) return;
  if (e.code === 'ArrowRight' || e.code === 'KeyD') inputs.right = true;
  if (e.code === 'ArrowLeft' || e.code === 'KeyQ' || e.code === 'KeyA') inputs.left = true;
  if (e.code === 'ArrowUp' || e.code === 'KeyW') inputs.up = true;
  if (e.code === 'ArrowDown' || e.code === 'KeyS') inputs.down = true;
  if (e.code === 'Space' && !e.repeat) startJump();
});

window.addEventListener('keyup', (e) => {
  if (e.code === 'ArrowRight' || e.code === 'KeyD') inputs.right = false;
  if (e.code === 'ArrowLeft' || e.code === 'KeyQ' || e.code === 'KeyA') inputs.left = false;
  if (e.code === 'ArrowUp' || e.code === 'KeyW') inputs.up = false;
  if (e.code === 'ArrowDown' || e.code === 'KeyS') inputs.down = false;
  if (e.code === 'Space') endJump();
});

function setupButton(id, onStart, onEnd) {
  const btn = document.getElementById(id);
  if (!btn) return;
  btn.addEventListener('pointerdown', (e) => { e.preventDefault(); onStart(); });
  btn.addEventListener('pointerup', (e) => { e.preventDefault(); if (onEnd) onEnd(); });
  btn.addEventListener('pointerleave', (e) => { e.preventDefault(); if (onEnd) onEnd(); });
}

setupButton('btnLeft', () => inputs.left = true, () => inputs.left = false);
setupButton('btnRight', () => inputs.right = true, () => inputs.right = false);
setupButton('btnJump', () => startJump(), () => endJump());

function generatePlatforms() {
  while (nextPlatformX < player.x + canvas.width + 300) {
    const sectionType = Math.floor(Math.random() * 3);
    let width, gap, newY;
    if (sectionType === 0) { width = 300 + Math.random() * 250; gap = 40 + Math.random() * 40; newY = currentLevelY; }
    else if (sectionType === 1) { width = 180 + Math.random() * 150; gap = 40 + Math.random() * 50; const step = (Math.random() > 0.5 ? 1 : -1) * 40; newY = Math.max(180, Math.min(330, currentLevelY + step)); }
    else { width = 160 + Math.random() * 140; gap = 70 + Math.random() * 50; newY = currentLevelY; }
    const platX = nextPlatformX + gap; currentLevelY = newY;
    platforms.push({ x: platX, y: currentLevelY, width: width, height: 200 });

    if (Math.random() > 0.3) {
      const numRings = Math.floor(3 + Math.random() * 4); const startX = platX + 40; const isArc = Math.random() > 0.5;
      for (let i = 0; i < numRings; i++) {
        if (startX + i * 28 < platX + width - 30) {
          const arcY = isArc ? Math.sin((i / (numRings - 1)) * Math.PI) * 35 : 0;
          rings.push({ x: startX + i * 28, y: currentLevelY - 32 - arcY, width: 22, height: 22, collected: false });
        }
      }
    }

    if (width > 200 && Math.random() > 0.4 && platX > 400) {
      const isFlying = Math.random() > 0.5;
      if (isFlying) {
        foes.push({
          x: platX + width / 3,
          y: currentLevelY - 90 - Math.random() * 40,
          baseY: currentLevelY - 90,
          width: 36,
          height: 36,
          minX: platX + 20,
          maxX: platX + width - 20,
          vx: 1.8,
          isFlying: true,
          flyAngle: Math.random() * Math.PI * 2,
          alive: true
        });
      } else {
        foes.push({
          x: platX + width / 2,
          y: currentLevelY - 36,
          baseY: currentLevelY - 36,
          width: 36,
          height: 36,
          minX: platX + 20,
          maxX: platX + width - 20,
          vx: 1.5,
          isFlying: false,
          alive: true
        });
      }
    }

    nextPlatformX = platX + width;
  }
  platforms = platforms.filter(p => p.x + p.width > cameraX - 400); 
  rings = rings.filter(r => r.x > cameraX - 400 && !r.collected);
  foes = foes.filter(f => f.x > cameraX - 400 && f.alive);
}

function checkCollision(r1, r2) { return r1.x < r2.x + r2.width && r1.x + r1.width > r2.x && r1.y < r2.y + r2.height && r1.y + r1.height > r2.y; }

let lastTime = performance.now();

function update() {
  if (!gameStarted) return;

  const now = performance.now();
  let dt = (now - lastTime) / (1000 / 60);
  lastTime = now;
  if (dt > 3) dt = 1;

  if (isDead) {
    player.vy += GRAVITY * dt;
    player.y += player.vy * dt;
    player.x += player.vx * dt;
    
    if (player.y > canvas.height + 150) {
      triggerGameOver();
    }
    return;
  }

  // Animation et physique des anneaux perdus
  for (let i = lostRings.length - 1; i >= 0; i--) {
    let lr = lostRings[i];
    lr.vy += (GRAVITY * 0.7) * dt;
    lr.x += lr.vx * dt;
    lr.y += lr.vy * dt;
    lr.life -= dt;
    if (lr.life <= 0) {
      lostRings.splice(i, 1);
    }
  }

  if (invincibilityTimer > 0) {
    invincibilityTimer -= dt;
  }

  if (boostTimer > 0) boostTimer -= dt;

  if (superSonicTimer > 0) {
    superSonicTimer -= dt;
    if (superSonicTimer <= 0) {
      stopSuperMusic();
      if (gameStarted) startNormalMusic();
    }
  }

  if (welcomeMsgTimer > 0) welcomeMsgTimer -= dt;

  if (!isHit) {
    const isSuper = superSonicTimer > 0;
    const currentTopSpeed = isSuper ? BASE_TOP_SPEED * 1.6 : (boostTimer > 0 ? BASE_TOP_SPEED * 1.45 : BASE_TOP_SPEED);
    const currentAccel = isSuper ? BASE_ACCEL * 1.8 : (boostTimer > 0 ? BASE_ACCEL * 1.5 : BASE_ACCEL);

    if (inputs.right) { player.vx = Math.min(player.vx + currentAccel * dt, currentTopSpeed); player.facingRight = true; }
    else if (inputs.left) { player.vx = Math.max(player.vx - currentAccel * dt, -currentTopSpeed); player.facingRight = false; }
    else { player.vx *= Math.pow(FRICTION, dt); }

    if (isSuper) {
      if (inputs.up) player.vy = -7;
      else if (inputs.down) player.vy = 7;
      else player.vy *= 0.85;
    } else {
      if (isJumping) {
        if (inputs.jumpPressed && jumpTimer < MAX_JUMP_HOLD_TIME) {
          player.vy += JUMP_HOLD_ACCEL * dt;
          jumpTimer += dt;
        } else {
          isJumping = false;
        }
      }
      player.vy += GRAVITY * dt; 
    }
  } else {
    player.vy += GRAVITY * dt;
  }

  player.x += player.vx * dt; 
  player.y += player.vy * dt;
  
  if (player.x < cameraX) { player.x = cameraX; player.vx = 0; }
  if (superSonicTimer > 0 && player.y < 20) player.y = 20;

  player.isGrounded = false;
  for (let plat of platforms) { 
    if (checkCollision(player, plat)) { 
      if (player.vy > 0 && (player.y + player.height - player.vy * dt) <= plat.y + 12) { 
        player.y = plat.y - player.height; 
        player.vy = 0; 
        player.isGrounded = true; 
        isJumping = false;

        if (isHit) {
          isHit = false;
        }
      } 
    } 
  }

  for (let foe of foes) {
    if (!foe.alive) continue;

    foe.x += foe.vx * dt;
    if (foe.x <= foe.minX || foe.x + foe.width >= foe.maxX) {
      foe.vx *= -1;
    }

    if (foe.isFlying) {
      foe.flyAngle += 0.08 * dt;
      foe.y = foe.baseY + Math.sin(foe.flyAngle) * 20;
    }

    if (checkCollision(player, foe)) {
      if (superSonicTimer > 0) {
        foe.alive = false;
        playSound('hit');
      } else if (player.vy > 0 && (player.y + player.height - player.vy * dt) <= foe.y + 15) {
        foe.alive = false;
        player.vy = -10;
        playSound('hit');
      } else if (!isHit && invincibilityTimer <= 0) {
        if (ringScore > 0) {
          ejectRings(); // Éjection visuelle des anneaux !
          ringScore = 0;
          ringDistElement.textContent = "0";
          isHit = true;
          player.vy = -6;
          player.vx = player.facingRight ? -4 : 4;
          invincibilityTimer = 180;
          playSound('hurt_dead');
        } else {
          isDead = true;
          stopAllMusic();
          player.vy = -9;
          player.vx = player.facingRight ? -2 : 2;
          playSound('hurt_dead');
          return;
        }
      }
    }
  }

  for (let r of rings) { 
    if (!r.collected && checkCollision(player, r)) { 
      r.collected = true; 
      ringScore++; 
      ringDistElement.textContent = ringScore; 
      
      const currentThreshold = Math.floor(ringScore / 100);
      if (currentThreshold > lastSuperThreshold) {
        lastSuperThreshold = currentThreshold;
        superSonicTimer = 600;
        playSound('super');
        startSuperMusic(); 
      } else if (ringScore % 10 === 0) {
        boostTimer = 300;
        playSound('boost');
      } else {
        playSound('ring'); 
      }
    } 
  }

  const currentSpeed = Math.abs(player.vx);
  if (currentSpeed > 0.2 && player.isGrounded) {
    runAnimTimer += currentSpeed * 0.035 * dt;
  } else {
    runAnimTimer = 0;
  }

  if (player.y > canvas.height + 100) { 
    triggerGameOver(); 
    return;
  }

  if (!player.isGrounded && superSonicTimer <= 0 && !isHit) {
    const rotationSpeed = 0.25;
    const directionMultiplier = player.facingRight ? 1 : -1;
    jumpRotationAngle += rotationSpeed * directionMultiplier * dt;
  } else {
    jumpRotationAngle = 0;
  }

  ringAnimAngle += 0.12 * dt; 
  generatePlatforms();
  cameraX = Math.max(0, player.x - 200); 
  
  const currentDist = Math.floor(player.x / 10);
  distElement.textContent = currentDist;
  if (currentDist > maxDistanceReached) maxDistanceReached = currentDist;
}

function drawPlayer() {
  if (invincibilityTimer > 0 && Math.floor(invincibilityTimer / 6) % 2 === 0 && !isDead) {
    return;
  }

  ctx.save();
  const centerX = player.x + player.width / 2;
  const centerY = player.y + player.height / 2;
  ctx.translate(centerX, centerY);

  const isSuper = superSonicTimer > 0;

  if (isSuper) {
    ctx.shadowColor = '#f1c40f';
    ctx.shadowBlur = 25;
  } else if (boostTimer > 0) {
    ctx.shadowColor = '#3498db';
    ctx.shadowBlur = 15;
  }

  if (isDead) {
    if (!player.facingRight) ctx.scale(-1, 1);
    if (sonicDeadImg.complete && sonicDeadImg.naturalWidth !== 0) {
      ctx.drawImage(sonicDeadImg, -player.width / 2, -player.height / 2, player.width, player.height);
    } else {
      ctx.fillStyle = '#e74c3c';
      ctx.fillRect(-player.width / 2, -player.height / 2, player.width, player.height);
    }
  } 
  else if (isHit) {
    if (!player.facingRight) ctx.scale(-1, 1);
    if (sonicGetHitImg.complete && sonicGetHitImg.naturalWidth !== 0) {
      ctx.drawImage(sonicGetHitImg, -player.width / 2, -player.height / 2, player.width, player.height);
    } else {
      ctx.fillStyle = '#e67e22';
      ctx.fillRect(-player.width / 2, -player.height / 2, player.width, player.height);
    }
  }
  else if (isSuper) {
    if (!player.facingRight) ctx.scale(-1, 1);
    if (superSonicImg.complete && superSonicImg.naturalWidth !== 0) {
      ctx.drawImage(superSonicImg, -player.width / 2 - 5, -player.height / 2 - 5, player.width + 10, player.height + 10);
    } else {
      ctx.fillStyle = '#f1c40f';
      ctx.fillRect(-player.width / 2, -player.height / 2, player.width, player.height);
    }
  } 
  else if (!player.isGrounded) {
    ctx.rotate(jumpRotationAngle);
    if (sonicJump.complete && sonicJump.naturalWidth !== 0) {
      ctx.drawImage(sonicJump, -player.width / 2, -player.height / 2, player.width, player.height);
    } else {
      ctx.fillStyle = '#3498db';
      ctx.beginPath(); ctx.arc(0, 0, player.width / 2, 0, Math.PI * 2); ctx.fill();
    }
  } 
  else {
    if (!player.facingRight) ctx.scale(-1, 1);

    if (Math.abs(player.vx) > 0.3) {
      const frameIndex = Math.floor(runAnimTimer) % sonicRunFrames.length;
      const currentRunSprite = sonicRunFrames[frameIndex];

      if (currentRunSprite && currentRunSprite.complete && currentRunSprite.naturalWidth !== 0) {
        ctx.drawImage(currentRunSprite, -player.width / 2, -player.height / 2, player.width, player.height);
      } else if (sonicIdle.complete && sonicIdle.naturalWidth !== 0) {
        ctx.drawImage(sonicIdle, -player.width / 2, -player.height / 2, player.width, player.height);
      } else {
        ctx.fillStyle = '#3498db'; 
        ctx.fillRect(-player.width / 2, -player.height / 2, player.width, player.height);
      }
    } else {
      if (sonicIdle.complete && sonicIdle.naturalWidth !== 0) {
        ctx.drawImage(sonicIdle, -player.width / 2, -player.height / 2, player.width, player.height);
      } else {
        ctx.fillStyle = '#3498db'; 
        ctx.fillRect(-player.width / 2, -player.height / 2, player.width, player.height);
      }
    }
  }
  ctx.restore();
}

function drawBackground() {
  if (skyImg.complete && skyImg.naturalWidth !== 0) {
    ctx.drawImage(skyImg, 0, 0, canvas.width, canvas.height);
  } else {
    const sky = ctx.createLinearGradient(0, 0, 0, canvas.height); 
    sky.addColorStop(0, '#0f1423'); sky.addColorStop(0.7, '#1d2744'); sky.addColorStop(1, '#3a2e39'); 
    ctx.fillStyle = sky; ctx.fillRect(0, 0, canvas.width, canvas.height);
  }

  if (bgImg.complete && bgImg.naturalWidth !== 0) {
    const bgWidth = bgImg.width;
    let bgX = -(cameraX * 0.1) % bgWidth;
    for (let x = bgX - bgWidth; x < canvas.width + bgWidth; x += bgWidth) {
      ctx.drawImage(bgImg, x, canvas.height - bgImg.height);
    }
  }

  if (seaImg.complete && seaImg.naturalWidth !== 0) {
    const seaWidth = seaImg.width;
    let seaX = -(cameraX * 0.3) % seaWidth;
    for (let x = seaX - seaWidth; x < canvas.width + seaWidth; x += seaWidth) {
      ctx.drawImage(seaImg, x, canvas.height - seaImg.height);
    }
  }
}

function drawWelcomeMessage() {
  if (welcomeMsgTimer <= 0) return;
  ctx.save();
  let alpha = 1;
  if (welcomeMsgTimer < 60) alpha = welcomeMsgTimer / 60;

  ctx.globalAlpha = alpha;
  ctx.font = '900 28px sans-serif';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';

  const text = "Get 100 Rings for a Surprise !";
  const x = canvas.width / 2;
  const y = 90;

  ctx.strokeStyle = 'black';
  ctx.lineWidth = 6;
  ctx.strokeText(text, x, y);

  ctx.fillStyle = '#f1c40f';
  ctx.fillText(text, x, y);

  ctx.restore();
}

function draw() {
  ctx.clearRect(0, 0, canvas.width, canvas.height); 
  ctx.imageSmoothingEnabled = false;

  drawBackground();

  ctx.save(); 
  ctx.translate(-cameraX, 0);

  for (let plat of platforms) {
    if (greenhillImg.complete && greenhillImg.naturalWidth !== 0) {
      ctx.save();
      ctx.translate(plat.x, plat.y);
      if (!greenhillPattern) greenhillPattern = ctx.createPattern(greenhillImg, 'repeat');
      ctx.fillStyle = greenhillPattern;
      ctx.fillRect(0, 0, plat.width, plat.height);
      ctx.restore();
    } else {
      ctx.fillStyle = '#795548'; ctx.fillRect(plat.x, plat.y, plat.width, plat.height);
      ctx.fillStyle = '#5d4037'; ctx.fillRect(plat.x, plat.y + 12, plat.width, plat.height);
      ctx.fillStyle = '#2ecc71'; ctx.fillRect(plat.x, plat.y, plat.width, 8);
      ctx.fillStyle = '#27ae60'; ctx.fillRect(plat.x, plat.y + 8, plat.width, 4);
    }
  }

  for (let foe of foes) {
    if (foe.alive) {
      ctx.save();
      ctx.translate(foe.x + foe.width / 2, foe.y + foe.height / 2);
      if (foe.vx < 0) ctx.scale(-1, 1);
      
      const currentImg = foe.isFlying ? foeFlySprite : foeSprite;

      if (currentImg.complete && currentImg.naturalWidth !== 0) {
        ctx.drawImage(currentImg, -foe.width / 2, -foe.height / 2, foe.width, foe.height);
      } else {
        ctx.fillStyle = foe.isFlying ? '#9b59b6' : '#e74c3c';
        ctx.fillRect(-foe.width / 2, -foe.height / 2, foe.width, foe.height);
      }
      ctx.restore();
    }
  }

  for (let r of rings) {
    if (!r.collected) {
      ctx.save();
      const rx = r.x + r.width / 2;
      const ry = r.y + r.height / 2;
      const scaleX = Math.cos(ringAnimAngle);
      
      ctx.translate(rx, ry);
      ctx.scale(scaleX, 1);

      if (ringSprite.complete && ringSprite.naturalWidth !== 0) {
        ctx.drawImage(ringSprite, -r.width / 2, -r.height / 2, r.width, r.height);
      } else {
        ctx.strokeStyle = '#f1c40f';
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.arc(0, 0, r.width / 2 - 2, 0, Math.PI * 2);
        ctx.stroke();
      }
      ctx.restore();
    }
  }

  // Rendu des anneaux expulsés lors d'un choc
  for (let lr of lostRings) {
    ctx.save();
    ctx.globalAlpha = Math.min(1, lr.life / 30);
    const scaleX = Math.cos(ringAnimAngle * 2);
    ctx.translate(lr.x, lr.y);
    ctx.scale(scaleX, 1);

    if (ringSprite.complete && ringSprite.naturalWidth !== 0) {
      ctx.drawImage(ringSprite, -lr.width / 2, -lr.height / 2, lr.width, lr.height);
    } else {
      ctx.strokeStyle = '#f1c40f';
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.arc(0, 0, lr.width / 2 - 2, 0, Math.PI * 2);
      ctx.stroke();
    }
    ctx.restore();
  }

  drawPlayer();
  ctx.restore();

  drawWelcomeMessage();
}

function gameLoop() { 
  update(); 
  draw(); 
  requestAnimationFrame(gameLoop); 
}

gameLoop();
</script>
